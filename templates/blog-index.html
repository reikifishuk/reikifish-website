<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blog</title>
</head>
<body>

<h1>Reiki Fish Blog</h1>

{% for post in posts %}
<article>
<h2><a href="/blog/posts/{{ post.slug }}.html">{{ post.title }}</a></h2>
<p>{{ post.excerpt }}</p>
<small>{{ post.date }}</small>
<hr>
</article>
{% endfor %}

</body>
</html>
