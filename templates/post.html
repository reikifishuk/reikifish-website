<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="canonical" href="/blog/posts/{{ slug }}.html">

<meta property="og:type" content="article">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="/blog/posts/{{ slug }}.html">
{% if featured_image %}
<meta property="og:image" content="/{{ featured_image }}">
{% endif %}

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ title }}">
<meta name="twitter:description" content="{{ description }}">

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="../../assets/images/favicon.svg" />
<link rel="stylesheet" href="../../assets/css/style.css?v=20260818-livesync">
<link rel="stylesheet" href="../../assets/css/mobile-responsive.css?v=20260818-livesync">
<link rel="stylesheet" href="../../assets/css/mega-menu.css?v=20260814-global">
<link rel="stylesheet" href="../../assets/css/mega-menu-controller.css?v=20260814-global">
</head>

<body class="blog-page">
<header class="inner-header">
  <nav class="navbar navbar-expand-lg fixed-top px-3 px-lg-5 py-3">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="../../index.html" aria-label="Andy Fish home">
        <img
          class="site-logo"
          src="../../assets/images/logo.png"
          alt="Andy Fish – Author, Psychology & Mindset Coach"
          width="1681"
          height="935"
        />
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNav" aria-controls="siteNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="siteNav">
        <ul class="navbar-nav align-items-lg-center gap-lg-3">
          <li class="nav-item"><a class="nav-link" href="../../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="../../about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="../../books.html">Books</a></li>
          <li class="nav-item"><a class="nav-link" href="../../coaching.html">Coaching</a></li>
          <li class="nav-item"><a class="nav-link" href="../../knowledge.html">Knowledge Hub</a></li>
          <li class="nav-item"><a class="nav-link" href="../../blog.html">Blog</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="article-header">
    <h1>{{ heading }}</h1>
    <p>{{ author }} • {{ date }}</p>
  </div>
</header>

<article class="blog-post">

{% if featured_image %}
<figure class="featured-image">
<img src="../../{{ featured_image }}"
     alt="{{ featured_image_alt }}"
     loading="eager">
{% if excerpt %}
<figcaption>{{ excerpt }}</figcaption>
{% endif %}
</figure>
{% endif %}

<div class="article-content">
{{ content }}
</div>

</article>

<div class="rf-premium-backdrop"></div>
<div class="rf-premium-menu" aria-label="Site navigation" aria-hidden="true">
  <div class="rf-pm-shell">
    <button class="rf-pm-close" type="button" aria-label="Close menu">&times;</button>
  </div>
</div>

<footer class="footer">
  <div class="container py-4 d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
    <p class="mb-0">© <span id="year"></span> Andy Fish. All rights reserved.</p>
    <div class="footer-links">
      <a href="../../about.html">About</a>
      <a href="../../books.html">Books</a>
      <a href="../../contact.html">Contact</a>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/main.js?v=20260818-livesync"></script>
<script src="../../assets/js/mega-menu.js?v=20260818-menu-duplicate-fix"></script>
<script src="../../assets/js/mega-menu-controller.js?v=20260818-menu-duplicate-fix"></script>

</body>
</html>
