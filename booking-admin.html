<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Booking Manager | ReikiFish</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/booking-admin.css"></head>
<body><header><div><span>PRIVATE MANAGER</span><h1>ReikiFish Bookings</h1></div><a href="booking.html">View booking page &rarr;</a></header><main><section id="login-panel" class="panel login"><h2>Open your booking manager</h2><p>Enter the private admin token configured in Cloudflare.</p><form id="login-form"><input id="admin-token" type="password" autocomplete="current-password" placeholder="Private admin token" required><button>Open manager</button></form></section><div id="manager" hidden><section class="metrics" id="metrics"></section><section class="manager-grid"><div class="panel"><div class="panel-heading"><div><span>AVAILABILITY</span><h2>Block time away</h2></div></div><form id="block-form" class="block-form"><label>Date<input type="date" name="date" required></label><label>Reason<input name="reason" placeholder="Holiday, appointment…"></label><button>Block date</button></form><div id="blocked-list" class="blocked-list"></div></div><div class="panel bookings-panel"><div class="panel-heading"><div><span>BOOKINGS</span><h2>Clients and payments</h2></div><button id="refresh" class="quiet">Refresh</button></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Client</th><th>Session</th><th>Payment</th><th>Status</th><th></th></tr></thead><tbody id="booking-rows"></tbody></table></div></div></section><p id="admin-status" role="status"></p></div></main><script src="assets/js/booking-admin.js"></script></body></html>
