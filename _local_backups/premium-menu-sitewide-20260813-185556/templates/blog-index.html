<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blog</title>

<link rel="stylesheet" href="/assets/css/mega-menu.css?v=20260813-breakpoint1">
</head>
<body>

<h1>Reiki Fish Blog</h1>

{% for post in posts %}
<article>
<h2><a href="/blog/posts/{{ post.slug }}.html">{{ post.title }}</a></h2>
<p>{{ post.excerpt }}</p>
<small>{{ post.date }}</small>
<hr>
</article>
{% endfor %}

<script src="/assets/js/mega-menu.js?v=20260813-breakpoint1"></script>
</body>
</html>
